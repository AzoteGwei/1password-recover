[project]
name = "1password-recover"
version = "1.0.0"
description = "Offline recover and decrypt 1Password SQLite database into 1PUX export"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pycryptodome>=3.20.0",
]

[project.scripts]
recover-op = "recover_op.cli:main"
migrate-op = "recover_op.migrate:main"

[tool.hatch.build.targets.wheel]
packages = ["recover_op"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
